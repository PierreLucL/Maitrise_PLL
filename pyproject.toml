[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maitrise-curbd"
version = "0.1.0"
description = "Pipeline CURBD pour donnees GCaMP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]